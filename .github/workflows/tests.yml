name: tests

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject sets requires-python >=3.11.
        python-version: ["3.11", "3.12"]

    # Selects the interpreter without changing the command, so CI runs exactly
    # what the README documents. A test enforces that they match.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Check the scenario lab parses
        run: bash -n scripts/scenario.sh

      - name: Run tests
        run: uv run pytest
